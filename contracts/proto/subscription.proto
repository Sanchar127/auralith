syntax = "proto3";

package subscription;

service SubscriptionService {

  rpc GetSubscription(
      GetSubscriptionRequest
  ) returns (
      SubscriptionResponse
  );

  rpc ReserveTokens(
      ReserveTokensRequest
  ) returns (
      ReserveTokensResponse
  );

  rpc SettleTokens(
      SettleTokensRequest
  ) returns (
      SettleTokensResponse
  );

  rpc ReleaseTokens(
      ReleaseTokensRequest
  ) returns (
      ReleaseTokensResponse
  );
}


message GetSubscriptionRequest {
  string user_id = 1;
}


message SubscriptionResponse {
  bool active = 1;
  int64 remaining_tokens = 2;
}


message ReserveTokensRequest {
  string user_id = 1;
  int64 estimated_tokens = 2;
  string request_id = 3;
  string model = 4;
}


message ReserveTokensResponse {
  bool success = 1;
  string reservation_id = 2;
  int64 reserved_tokens = 3;
  int64 remaining_tokens = 4;
  string message = 5;
}


message SettleTokensRequest {
  string user_id = 1;
  string reservation_id = 2;
  string request_id = 3;
  int64 input_tokens = 4;
  int64 output_tokens = 5;
  int64 total_tokens = 6;
  string model = 7;
}


message SettleTokensResponse {
  bool success = 1;
  int64 charged_tokens = 2;
  int64 refunded_tokens = 3;
  int64 remaining_tokens = 4;
  string message = 5;
}


message ReleaseTokensRequest {
  string user_id = 1;
  string reservation_id = 2;
  string request_id = 3;
}


message ReleaseTokensResponse {
  bool success = 1;
  int64 released_tokens = 2;
  int64 remaining_tokens = 3;
  string message = 4;
}