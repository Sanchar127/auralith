global:
  scrape_interval: 15s
  evaluation_interval: 15s

  external_labels:
    environment: development
    project: auralith

scrape_configs:

  # ==========================================
  # Auralith Backend
  # ==========================================

  - job_name: "auralith-backend"

    metrics_path: /metrics

    static_configs:
      - targets:
          - "api:8000"

        labels:
          service: "backend"

  # ==========================================
  # Auralith Subscription Service
  # ==========================================

  - job_name: "auralith-subscription"

    metrics_path: /metrics

    static_configs:
      - targets:
          - "subscription:8002"

        labels:
          service: "subscription"