name: Auralith CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auralith-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Full CI
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      APP_ENV: test
      LOG_LEVEL: WARNING

      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      REDIS_PORT: 6379

      RABBITMQ_DEFAULT_USER: ${{ vars.RABBITMQ_DEFAULT_USER }}
      RABBITMQ_DEFAULT_PASS: ${{ secrets.RABBITMQ_DEFAULT_PASS }}

      MINIO_ROOT_USER: ${{ vars.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      MINIO_API_PORT: 9000

      QDRANT_PORT: 6333
      OLLAMA_PORT: 11434
      API_PORT: 8000

      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # 3. Install uv
      # ======================================================

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # ======================================================
      # 4. Create CI environment
      # ======================================================

      - name: Create CI environment
        run: |
          cat > .env <<EOF
          APP_ENV=${APP_ENV}
          LOG_LEVEL=${LOG_LEVEL}

          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}

          REDIS_PORT=${REDIS_PORT}

          RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
          RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}

          MINIO_ROOT_USER=${MINIO_ROOT_USER}
          MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
          MINIO_API_PORT=${MINIO_API_PORT}

          QDRANT_PORT=${QDRANT_PORT}
          OLLAMA_PORT=${OLLAMA_PORT}
          API_PORT=${API_PORT}

          SECRET_KEY=${SECRET_KEY}
          EOF

          chmod 600 .env

      # ======================================================
      # 5. Verify Docker
      # ======================================================

      - name: Verify Docker
        run: |
          docker --version
          docker compose version

      # ======================================================
      # 6. Run complete Auralith CI
      # ======================================================

      - name: Run CI
        run: |
          chmod +x scripts/ci/*.sh
          ./scripts/ci/ci.sh

      # ======================================================
      # 7. Cleanup CI environment
      # ======================================================

      - name: Remove CI environment
        if: always()
        run: |
          rm -f .env