[project]
name = "auralith-backend"
version = "0.1.0"
description = "AI Music Generation Backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"

authors = [
    { name = "Sanchar Panthi" }
]

dependencies = [
    # ==================================================
    # FastAPI
    # ==================================================
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
    # ==================================================
    # Database
    # ==================================================
    "sqlalchemy>=2.0.42",
    "asyncpg>=0.30.0",
    "alembic>=1.16.4",
    # ==================================================
    # Configuration
    # ==================================================
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    # ==================================================
    # Authentication
    # ==================================================
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.3.0",
    # ==================================================
    # HTTP Client
    # ==================================================
    "httpx>=0.28.1",
    # ==================================================
    # JSON
    # ==================================================
    "orjson>=3.11.1",
    # ==================================================
    # Logging
    # ==================================================
    "structlog>=25.4.0",
    # ==================================================
    # Background Jobs
    # ==================================================
    "celery>=5.5.3",
    "redis>=6.2.0",
    # ==================================================
    # Ollama
    "qdrant-client>=1.14.0",
    # ==================================================
    "ollama>=0.5.1",
    # ==================================================
    # Numerical Computing
    # ==================================================
    "numpy>=2.3.2",
    # ==================================================
    # Audio Processing
    # ==================================================
    "librosa>=0.11.0",
    "soundfile>=0.13.1",
    "pydub>=0.25.1",
    "ffmpeg-python>=0.2.0",
    # ==================================================
    # MIDI
    # ==================================================
    "pretty-midi>=0.2.11",
    "mido>=1.3.3",
    "music21>=9.7.1",
    # ==================================================
    # Audio Rendering
    # ==================================================
    "pyfluidsynth>=1.3.4",
    # ==================================================
    # File Uploads
    # ==================================================
    "python-multipart>=0.0.20",
    # ==================================================
    # Retry
    # ==================================================
    "tenacity>=9.1.2",
    "minio>=7.2.20",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [

    # Testing
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",

    # Formatting
    "black>=25.1.0",
    "isort>=6.0.1",
    "ruff>=0.12.5",

    # Typing
    "mypy>=1.17.1",

    # Git Hooks
    "pre-commit>=4.3.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
