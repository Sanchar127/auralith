  ollama:
    image: ollama/ollama:latest

    container_name: ${OLLAMA_CONTAINER_NAME}

    restart: unless-stopped

    ports:
      - "${OLLAMA_PORT}:11434"

    volumes:
      - ollama-data:/root/.ollama

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - backend-network

  qdrant:
    image: qdrant/qdrant:v1.15.4

    container_name: ${QDRANT_CONTAINER_NAME}

    restart: unless-stopped

    ports:
      - "${QDRANT_PORT}:6333"

    volumes:
      - qdrant-data:/qdrant/storage


    networks:
      - backend-network

  deepfilternet:
    build:
      context: .
      dockerfile: docker/deepf.Dockerfile

    container_name: auralith-deepfilternet

    restart: unless-stopped

    ports:
      - "8001:8001"
      - "50053:50053"
    volumes:
      - ./deepfilternet/output:/app/output
      - ./deepfilternet/logs:/app/logs

    networks:
      - backend-network



  matchering:
      build:
        context: .
        dockerfile: docker/matchering.Dockerfile

      image: auralith-matchering:latest

      container_name: auralith-matchering

      restart: unless-stopped

      ports:
        - "8003:8003"

      volumes:
        - ./services/matchering:/app
        - ./storage/matchering/input:/app/input
        - ./storage/matchering/reference:/app/reference
        - ./storage/matchering/output:/app/output
        - ./storage/matchering/temp:/app/temp

      healthcheck:
        test:
          [
            "CMD",
            "curl",
            "-f",
            "http://localhost:8003/health"
          ]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 20s

      stdin_open: true
      tty: true

      networks:
        - backend-network

  
  subscription:
    container_name: auralith-subscription

    build:
      context: .
      dockerfile: docker/subscription.Dockerfile

    image: auralith-subscription:latest

    restart: unless-stopped

    env_file:
      - .env

    environment:
      PYTHONPATH: "/app/subscription/generated:/app/subscription"

    working_dir: /app/subscription

    ports:
      - "8002:8002"
      - "50052:50052"
  
    volumes:
      - .:/app
      - ./contracts:/app/contracts
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - --reload
    networks:
      - backend-network

  minio:
    image: minio/minio:latest

    container_name: ${MINIO_CONTAINER_NAME}

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"

    volumes:
      - minio-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 30s
      timeout: 20s
      retries: 3

    networks:
      - backend-network

  minio-init:
    image: minio/mc:latest

    container_name: auralith-minio-init

    depends_on:
      minio:
        condition: service_healthy
      

    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${MINIO_BUCKET};
      mc anonymous set none local/${MINIO_BUCKET};
      echo 'MinIO bucket initialized.';
      exit 0;
      "

    restart: "no"

    networks:
      - backend-network

volumes:
  postgres-data:
    name: auralith_postgres_data

  redis-data:
    name: auralith_redis_data

  ollama-data:
    name: auralith_ollama_data

  minio-data:
    name: auralith_minio_data
  
  # yue-models:
  #   name: auralith_yue_models

  # yue-cache:
  #   name: auralith_yue_cache
  qdrant-data:
    name: auralith_qdrant_data

  matchering-input:
    name: auralith_matchering_input

  matchering-reference:
    name: auralith_matchering_reference

  matchering-output:
    name: auralith_matchering_output

  matchering-temp:
    name: auralith_matchering_temp

networks:
  backend-network:
    driver: bridge